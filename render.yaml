# النشر على Render — خدمة ويب مجانية (Webhook)
# الخطة المجانية: الخدمة بتنام بعد 15 دقيقة من غير طلبات وبتصحى لما ييجي طلب جديد
services:
  - type: web
    name: quran-telegram-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT api.index:app
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
