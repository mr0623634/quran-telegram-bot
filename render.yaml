# بديل: النشر على Render (مجاني) — خدمة Worker شغالة 24 ساعة
# من لوحة Render: New + → Background Worker → اربط مستودع GitHub فيه الملفات دي
# وحط متغير البيئة TELEGRAM_BOT_TOKEN
services:
  - type: worker
    name: quran-telegram-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main_polling.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
